<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCE - Login</title>
    <link rel="icon" href="img/BCE_Logo_White_NoText(favicon2).png">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap JS Bundle-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom CSS Files-->
    <link rel="stylesheet" href="styles/login-signup.css">
    <link rel="stylesheet" href="styles/global.css">
    <!--Scripts-->
    <script src="js/script.js"></script>
    <script src="js/header-footer-loader.js"></script>
</head>
<body>
    <div id="header"></div>
    <section class="reg-section-wrapper d-flex flex-column align-items-center" style="margin: 64px 0;">
        <div class="reg-form-box-signup d-flex flex-row align-items-center justify-content-between">
            <div class="design-line"></div>
            <div class="reg-content-signup d-flex flex-column align-items-center justify-content-start" style="gap: 30px;">
                <h2 class="reg-title">Sign Up</h2>
                <form action="#" class="reg-form d-flex flex-column align-items-center" style="gap: 10px;">
                    <div class="reg-field d-flex">
                        <label for="" class="input-label">Email</label>
                        <input type="text" placeholder="Email" class="default-input">
                    </div>
                    <div class="reg-field d-flex">
                        <label for="" class="input-label">Username</label>
                        <input type="text" placeholder="Username" class="default-input">
                    </div>
                    <div class="reg-field d-flex">
                        <label for="" class="input-label">Password</label>
                        <input type="text" placeholder="Password" class="default-input">
                    </div>
                    <div class="d-flex flex-row align-items-center align-self-end">
                        <input type="checkbox" class="default-checkbox">
                        <label for="" class="checkbox-label">Show Password</label>
                    </div>
                    <div class="reg-field d-flex">
                        <label for="" class="input-label">Confirm Password</label>
                        <input type="text" placeholder="Confirm Password" class="default-input">
                    </div>
                    <input type="submit" value="Sign Up" class="submit-btn" style="margin-top: 40px;">
                    <p class="helper-text">Already have an account? Login <a href="login.html" style="text-decoration: underline; color: #fff;"> here</a> now!</p>
                </form>
            </div>
            <div class="design-line"></div>
        </div>
    </section>
    <div id="footer"></div>
</body>
</html>
