<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCE - Home Page</title>
    <link rel="icon" href="img/BCE_Logo_White_NoText(favicon2).png">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/styles.css">

    <!-- Bootstrap JS Bundle-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
    
    <!-- Swiper JS and CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    
    <!-- Custom JS to log when all resources are loaded -->
    <script>
        window.addEventListener("load", function() {
            console.log("All resources finished loading!");
        });
    </script>
</head>
<body>
    <header class="d-flex align-items-center justify-content-between" style="padding: 20px 0px;">
        <a href="index.html">
            <img src="img/BCE_Logo_Black_Text(final).png" alt="BCE Logo" class="img-fluid bce-logo" width="220px" height="auto">
        </a>
        <a href="#" class="dark-mode-center">
            <img src="img/Icons/darkmode-icon.png" alt="Dark mode icon">
        </a>
        <nav class="d-flex navbar-full">
            <div class="d-flex align-items-center" style="gap: 64px;">
                <a href="index.html"><span class="navbar-link active">Home</span></a>
                <a href="#"><span class="navbar-link">Events</span></a>
                <a href="#"><span class="navbar-link">About Us</span></a>
            </div>
            <button type="button" class="btn btn-primary bce-login-btn">Login</button>
        </nav>
    </header>
    <div class="starter-content d-flex align-items-center" id="starter-content">
        <img 
            src="img/bg-imgs/Main img.png" alt="People On Event Background Picture" id="main-image"
            style="position: absolute; z-index: -1; left: 0; object-fit: cover;" width="100%" height="100%"
        >
        <div class="d-flex flex-column">
            <p class="starter-content-main-text">
                DISCOVER<br>
                BRISTOL’S<br>
                MOST<br>
                BREATHTAKING<br>
                EVENTS
            </p>
            <p class="starter-content-secondary-text">
                From festivals to workshops — find, book, and experience it all.
            </p>
        </div>
    </div>
    <div class="events d-flex flex-column">
        <div class="events-header d-flex align-items-center justify-content-center">
            <h2 class="events-header-text">Events</h2>
        </div>
        <div class="content-cards">
            <div class="swiper mySwiper">
                <div class="swiper-wrapper">
                    <div class="swiper-slide custom-card">Card 1</div>
                    <div class="swiper-slide custom-card">Card 2</div>
                    <div class="swiper-slide custom-card">Card 3</div>
                    <div class="swiper-slide custom-card">Card 4</div>
                </div>
                <!-- Add Navigation -->
                <div class="custom-next d-flex align-items-center justify-content-center">
                    <img src="img/Icons/icon_next.png" alt="">
                </div>
                <div class="swiper-button-prev custom-prev"></div>
            </div>
        </div>
    </div>
</body>
</html>
