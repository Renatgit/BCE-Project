<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCE - Login</title>
    <link rel="icon" href="img/BCE_Logo_White_NoText(favicon2).png">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap JS Bundle-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom CSS Files-->
    <link rel="stylesheet" href="styles/login-signup.css">
    <link rel="stylesheet" href="styles/global.css">
    <!--Scripts-->
    <script src="js/script.js"></script>
    <script src="js/header-footer-loader.js"></script>
</head>
<body>
    <div id="header"></div>
    <section class="reg-section-wrapper d-flex flex-column align-items-center" style="margin: 64px 0;">
        <div class="reg-form-box d-flex flex-row align-items-center justify-content-between">
            <div class="design-line"></div>
            <div class="reg-content d-flex flex-column align-items-center">
                <h2 class="reg-title">Login</h2>
                <form action="#" class="d-flex flex-column align-items-center">
                    <div class="d-flex flex-row align-items-center">
                        <label for="username" class="input-label">Username</label>
                        <input type="text" placeholder="Username or Email" class="default-input">
                    </div>
                    <div class="d-flex flex-row align-items-center">
                        <label for="password" class="input-label">Password</label>
                        <input type="text" placeholder="Password" class="default-input">
                    </div>
                    <div class="d-flex flex-row align-items-center">
                        <input type="checkbox" class="default-checkbox">
                        <label for="password-checkbox" class="checkbox-label">Show Password</label>
                    </div>
                </form>
            </div>
            <div class="design-line"></div>
        </div>
    </section>
    <div id="footer"></div>
</body>
</html>
