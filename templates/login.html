{% extends "base.html" %}

{% block title %}BCE - Login{% endblock %}

{% block extra_css %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='styles/login-signup.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='styles/global.css') }}">
{% endblock %}

{% block content %}
<section class="reg-section-wrapper d-flex flex-column align-items-center" style="margin: 64px 0;">
        <div class="reg-form-box d-flex flex-row align-items-center justify-content-between">
            <div class="design-line"></div>
            <div class="reg-content d-flex flex-column align-items-center justify-content-start" style="gap: 100px;">
                <h2 class="reg-title">Login</h2>
                <form action="/login" method="POST" class="reg-form d-flex flex-column align-items-center" style="gap: 20px;">
                    <div class="reg-field d-flex">
                        <div class="input-row d-flex">
                            <label for="" class="input-label">Username</label>
                            <input type="text" name="login" placeholder="Username or Email" class="default-input">
                        </div>
                    </div>
                    <div class="reg-field d-flex">
                        <div class="input-row d-flex">
                            <label for="" class="input-label">Password</label>
                            <input type="password" name="password" placeholder="Password" class="default-input" id="password">
                        </div>
                    </div>
                    <div class="d-flex flex-row align-items-center align-self-end">
                        <input type="checkbox" class="default-checkbox" id="showPassword">
                        <label for="" class="checkbox-label">Show Password</label>
                    </div>
                    <input type="submit" value="Login" class="submit-btn" style="margin-top: 40px;">
                    <p class="helper-text">Don't have an account? Sign Up <a href="{{ url_for('auth.signup') }}" style="text-decoration: underline; color: #fff;">here</a> now!</p>
                </form>
            </div>
            <div class="design-line"></div>
        </div>
    </section>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
<script src="{{ url_for('static', filename='js/show-password.js') }}"></script>
{% endblock %}
